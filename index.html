<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCode – Free AI Coding Agent</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header>
  <div class="brand">⚡ QCode <span>free agent · Qwen · Kimi · DeepSeek</span></div>
  <div class="hdr-actions">
    <select id="modelSelect" title="Model"></select>
    <button id="refreshModels" title="Fetch current free models">⟳</button>
    <label class="btn" title="Import files or .zip">⬆ Import<input id="importInput" type="file" multiple hidden></label>
    <button id="exportZip" title="Download workspace as zip">⬇ Zip</button>
    <button id="openSettings">⚙ Settings</button>
  </div>
</header>

<main>
  <aside id="filesPane">
    <div class="pane-head">
      <span>FILES</span>
      <div>
        <button id="newFile" title="New file">＋</button>
        <button id="resetWs" title="Reset workspace">🗑</button>
      </div>
    </div>
    <ul id="fileList"></ul>
  </aside>

  <section id="centerPane">
    <div class="tabs">
      <button class="tab active" data-tab="editor">Editor</button>
      <button class="tab" data-tab="preview">Preview</button>
      <span id="activePath"></span>
    </div>
    <div id="editorWrap" class="tabbody">
      <textarea id="editor" spellcheck="false" placeholder="Select or create a file…"></textarea>
    </div>
    <div id="previewWrap" class="tabbody hidden">
      <iframe id="preview" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
    </div>
  </section>

  <section id="chatPane">
    <div class="pane-head"><span>AGENT</span><button id="clearChat" title="Clear conversation">Clear</button></div>
    <div id="messages"></div>
    <form id="chatForm">
      <textarea id="prompt" rows="3" placeholder="Ask the agent… e.g. 'Build a todo app with local storage'  (Enter = send, Shift+Enter = newline, /help)"></textarea>
      <div class="chat-actions">
        <span id="status"></span>
        <button type="button" id="stopBtn" class="hidden">■ Stop</button>
        <button type="submit" id="sendBtn">Send ➤</button>
      </div>
    </form>
  </section>
</main>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h3>Settings</h3>
    <label>API base URL (OpenAI-compatible)
      <input name="baseUrl" placeholder="https://openrouter.ai/api/v1">
    </label>
    <label>API key <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">get a free OpenRouter key</a>
      <input name="apiKey" type="password" placeholder="sk-or-v1-…">
    </label>
    <label>Custom model ID (overrides dropdown, optional)
      <input name="customModel" placeholder="e.g. qwen/qwen3-coder:free">
    </label>
    <div class="row">
      <label>Max agent steps <input name="maxSteps" type="number" min="1" max="100"></label>
      <label>Temperature <input name="temperature" type="number" step="0.1" min="0" max="2"></label>
    </div>
    <label class="check"><input name="autoApprove" type="checkbox"> Auto-approve file writes / deletes / code runs</label>
    <label class="check"><input name="fallback" type="checkbox"> Auto-fallback to other free models on rate limit / error</label>
    <p class="note">Your key is stored only in this browser (localStorage) and sent directly to the provider.</p>
    <div class="dlg-actions">
      <button value="cancel">Cancel</button>
      <button value="save" class="primary">Save</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
